name: 错误报告
description: 报告可复现的软件缺陷，请勿提交任何真实凭据。
title: "[错误] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除或替换 API Key、管理密钥、认证 JSON、内网地址、用户名和真实路径。
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 例如 0.3.0
    validations:
      required: true
  - type: input
    id: cpa_version
    attributes:
      label: CPA 版本
      placeholder: 例如 v7.2.104
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows amd64
        - Linux amd64
        - Linux arm64
        - macOS
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？预期行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 使用已脱敏配置……
        2. 调用……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: sanitized_config
    attributes:
      label: 已脱敏的相关配置
      description: 只粘贴与插件相关的最小片段；不要上传完整 config.yaml 或认证文件。
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或状态
      description: 请删除 token、密钥、响应正文、用户名、地址和真实文件路径。
      render: text
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已经确认内容中不包含真实凭据或隐私信息。
          required: true
        - label: 我已阅读部署指南和已知限制。
          required: true
