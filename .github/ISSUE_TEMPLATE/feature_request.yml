name: 功能建议
description: 提议新的功能、配置或文档改进。
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 请描述要解决的问题，不要包含真实凭据或内部信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、配置示例和兼容性要求。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已经尝试过哪些替代方式？
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议与 CPA 动态插件、调度、配置、构建或文档直接相关。
          required: true
        - label: 内容中不包含任何真实密钥、认证文件或隐私信息。
          required: true
