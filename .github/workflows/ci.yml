name: 持续集成

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 测试、静态检查与安全检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查格式
        shell: bash
        run: |
          files=$(find cmd internal -type f -name '*.go' -print0 | xargs -0 gofmt -l)
          if [ -n "$files" ]; then
            printf '以下文件需要执行 gofmt：\n%s\n' "$files"
            exit 1
          fi

      - name: 运行单元测试
        run: go test -mod=readonly -count=1 ./...

      - name: 运行静态检查
        run: go vet ./...

      - name: 运行竞态检测
        run: go test -mod=readonly -race -count=1 ./...

      - name: 检查敏感信息
        run: bash scripts/check-secrets.sh

      - name: 检查补丁空白错误
        run: git diff --check
